# ============================================================
# Aufgaben-Bank füllen: Lückentext-Aufgaben passend zum
# Lernstand. Aktuell NUR von Hand (Actions -> "Aufgaben-Bank
# füllen" -> Run workflow) — der Nachtlauf ist abgestellt,
# solange die App offiziell im Alt-Modus (Vokabeln) läuft.
# Zum Reaktivieren den schedule-Block wieder einkommentieren:
#   schedule:
#     - cron: '0 3 * * *'
# Schreibt direkt in die Datenbank (exercise_bank).
# ============================================================
name: Aufgaben-Bank füllen

on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'Trockenlauf (nichts schreiben)'
        type: boolean
        default: false
      profil:
        description: 'Nur ein Profil bauen (schneller beim Iterieren)'
        type: choice
        options: [beide, ko, de]
        # Entwicklung läuft derzeit nur auf der koreanischen Seite
        default: ko

jobs:
  fuellen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Aufgaben erzeugen
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          PROFIL="${{ inputs.profil }}"
          if [ "${{ inputs.dry }}" = "true" ]; then
            node scripts/baue-aufgaben.mjs --dry --profil "${PROFIL:-beide}" 2>&1 | tee lauf.log
          else
            node scripts/baue-aufgaben.mjs --profil "${PROFIL:-beide}" 2>&1 | tee lauf.log
          fi

      # Protokoll prominent auf die Run-Übersichtsseite
      - name: Protokoll anzeigen
        if: always()
        run: |
          echo '## Aufgaben-Lauf' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 lauf.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
