# ============================================================
# Nomen-Bereinigung: falsche Plural-Einträge der de-Seite finden
# (z. B. "die Lebensmittel" -> "das Lebensmittel"). Von Hand
# starten: Actions -> "Nomen bereinigen" -> Run workflow.
# ERST ohne Haken laufen lassen (reine Vorschau im Protokoll),
# dann mit anwenden=true, wenn die Vorschläge gut aussehen.
# ============================================================
name: Nomen bereinigen

on:
  workflow_dispatch:
    inputs:
      anwenden:
        description: 'Vorschläge wirklich in die Datenbank schreiben'
        type: boolean
        default: false

jobs:
  bereinigen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Nomen prüfen
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          if [ "${{ inputs.anwenden }}" = "true" ]; then
            node scripts/bereinige-nomen.mjs --anwenden 2>&1 | tee lauf.log
          else
            node scripts/bereinige-nomen.mjs 2>&1 | tee lauf.log
          fi

      - name: Protokoll anzeigen
        if: always()
        run: |
          echo '## Bereinigungs-Lauf' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 lauf.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
